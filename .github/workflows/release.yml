name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  windows-msi:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --all
      - run: cargo build --release
      - run: target/release/questlog.exe . --no-anim
      - run: dotnet tool install --global wix --version 5.0.2
      - run: wix extension add -g WixToolset.UI.wixext/5.0.2
      - run: wix build installer/questlog.wxs -ext WixToolset.UI.wixext -arch x64 -d ExePath=target/release/questlog.exe -o questlog-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: questlog-windows
          path: |
            questlog-x64.msi
            target/release/questlog.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            questlog-x64.msi
            target/release/questlog.exe
