name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-msi:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cargo test --all
      - run: cargo build --release
      - run: target/release/questlog.exe . --no-anim
      - run: dotnet tool install --global wix --version 5.0.2
      - run: wix extension add -g WixToolset.UI.wixext/5.0.2
      - run: wix build installer/questlog.wxs -ext WixToolset.UI.wixext -arch x64 -d ExePath=target/release/questlog.exe -o questlog-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: questlog-windows
          path: |
            questlog-x64.msi
            target/release/questlog.exe
      - name: publish release (GitHub CLI, no third-party action)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" questlog-x64.msi target/release/questlog.exe --repo "$GITHUB_REPOSITORY" --generate-notes
