name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: cargo test --all
      - run: cargo build --release
      - name: self-audit
        if: matrix.os == 'ubuntu-latest'
        run: ./target/release/questlog . --no-anim --min-score 70
